name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Validate annotated tag and version
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Test source
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
      - name: Build distributions
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Verify installed entry points
        run: |
          python -m venv "$RUNNER_TEMP/release-check"
          "$RUNNER_TEMP/release-check/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/release-check/bin/sc" --version
          "$RUNNER_TEMP/release-check/bin/super-codex" --version
          "$RUNNER_TEMP/release-check/bin/sc" version --json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
